eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      # Set EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/ in docker-compose only
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Expose Actuator Health Endpoint for Docker Compose health checks
# (api-gateway adds "gateway" in its own api-gateway.yml)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Shared JWT Configuration
jwt:
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_UNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Shared JPA Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.JsonSerializer
      properties:
        spring.json.add.type.headers: false # Optional, keeps headers clean if your consumers use standard JSON deserializers


# Shared Logging Configuration
logging:
  level:
    org:
      springframework:
        security: INFO
      hibernate:
        SQL: DEBUG

razorpay:
  api:
    key: ${RAZORPAY_API_KEY}
    secret: ${RAZORPAY_API_SECRET}
stripe:
  api:
    key: ${STRIPE_API_KEY}

fraud:
  max-transactions-per-minute: 5
  suspicious-amount-multiplier: 5
  max-balance-percentage: 0.90

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:10001}

notification:
  mail:
    from: imagineeffect65@gmail.com