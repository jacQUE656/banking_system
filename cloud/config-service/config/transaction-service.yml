server:
  port: 10006
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${TRANSACTION_DB:transaction_db}
    username: ${POSTGRES_USER:banking_user}
    password: ${POSTGRES_PASSWORD:banking_password}
    driver-class-name: org.postgresql.Driver

  kafka:
    consumer:
      group-id: transaction-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap  # Payload type