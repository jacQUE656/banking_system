server:
  port: 8761

spring:
  application:
    name: eureka-server
  cloud:
    config:
      enabled: false # Temporarily disable config server import for eureka-server to test locally

eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/